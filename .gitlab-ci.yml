# gitlab.com/nomograph/sysml .gitlab-ci.yml
#
# Pipeline structure provided by nomograph/pipeline tool-rust@v5.5.0
# (gates + Rust CLI build/sign/publish/release flow).

default:
  tags: [storr]

include:
  - component: gitlab.com/nomograph/pipeline/tool-rust@v5.14.1
    inputs:
      binary_name: sysml
      project_description: "CLI-native knowledge graph toolkit for SysML v2."
      crates_publish: true
      crates_workspace_packages: "nomograph-sysml-core,nomograph-sysml"
      # paste 1.0.15 (RUSTSEC-2024-0436) and rand 0.9.2
      # (RUSTSEC-2026-0097) enter transitively via fastembed.
      # Neither is liftable upstream; deny.toml's [advisories.ignore]
      # carries the rationale and gates the audit on those specific
      # IDs only, so audit_allow_failure stays false here.
      audit_allow_failure: false
      # v5.5.0's `check` job defaults to --all-features, which pulls in
      # sysml-core's `vector` feature -> fastembed -> onnxruntime. The
      # CI image's prebuilt onnxruntime fails to LINK (rust-lld:
      # undefined symbol __isoc23_strtoull, a glibc-2.38 symbol absent
      # from the image). `vector` is optional and not part of the
      # default shipped build, so it's excluded here. `mcp` (the
      # feature that actually had a real bug) stays compiled.
      check_features: "--features nomograph-sysml/mcp"
  # Fail-closed automerge gate (renovate-architecture L1 verdict
  # contract): osv-verdict -> CHECK_OSV, cargo-verdict -> CHECK_CARGO
  # (builds+tests the workspace), automerge-gate blocks unless every
  # required check is PRESENT and ==pass. The gate job's green/red is
  # the pipeline status Renovate reads before GitLab native auto-merge.

  # Secret detection that BLOCKS, replacing the upstream
  # Jobs/Secret-Detection.gitlab-ci.yml template. That template cannot
  # fail a pipeline on a leaked credential: its analyzer invokes gitleaks
  # with --exit-code 0, so the process exits 0 even when it found
  # secrets, and flipping allow_failure only makes OPERATIONAL faults
  # blocking. secret-verdict runs the same analyzer with the same ruleset
  # (identical scan surface -- this is a swap of the include:, not a
  # change in what gets flagged), then parses
  # gl-secret-detection-report.json, exits nonzero on a non-empty
  # vulnerabilities array, and fails closed when the report is absent.
  # The verdict trio moves to @v5.10.0 together with secret-verdict, not
  # opportunistically: automerge-gate's secret_job needs-slot (how
  # CHECK_SECRET reaches the gate) exists only from v5.10.0, and the
  # v5.10.0 gate carries the bare-branch rule clause that osv-verdict and
  # cargo-verdict gained in 5.8.0/5.9.1 -- bumping the gate alone would
  # instantiate it on branch pushes where the older verdicts still do not
  # run, and it would block fail-closed on absent CHECK_OSV/CHECK_CARGO.
  - component: gitlab.com/nomograph/pipeline/secret-verdict@v5.14.1
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/osv-verdict@v5.14.1
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/cargo-verdict@v5.14.1
    inputs:
      stage: verdict
      cargo_test_args: "--workspace"
      # Same vector/onnxruntime exclusion as tool-rust's check job
      # above -- keep mcp compiled, keep vector (and its unlinkable
      # onnxruntime dep) out of CI.
      check_features: "--features nomograph-sysml/mcp"
  - component: gitlab.com/nomograph/pipeline/automerge-gate@v5.14.1
    inputs:
      stage: gate
      required-checks: "osv,cargo,secret"

stages: [lint, test, build, sign, publish, release, notify, verdict, gate]

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
