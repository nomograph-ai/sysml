# gitlab.com/nomograph/sysml .gitlab-ci.yml
#
# Pipeline structure provided by nomograph/pipeline tool-rust@v4.2.0
# (gates + Rust CLI build/sign/publish/release flow).

default:
  tags: [storr]

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - component: gitlab.com/nomograph/pipeline/tool-rust@740db2f
    inputs:
      binary_name: sysml
      project_description: "CLI-native knowledge graph toolkit for SysML v2."
      crates_publish: true
      crates_workspace_packages: "nomograph-sysml-core,nomograph-sysml"
      # paste 1.0.15 (RUSTSEC-2024-0436) and rand 0.9.2
      # (RUSTSEC-2026-0097) enter transitively via fastembed.
      # Neither is liftable upstream; deny.toml's [advisories.ignore]
      # carries the rationale and gates the audit on those specific
      # IDs only, so audit_allow_failure stays false here.
      audit_allow_failure: false
  # Fail-closed automerge gate (renovate-architecture L1 verdict
  # contract): osv-verdict -> CHECK_OSV, cargo-verdict -> CHECK_CARGO
  # (builds+tests the workspace), automerge-gate blocks unless every
  # required check is PRESENT and ==pass. The gate job's green/red is
  # the pipeline status Renovate reads before GitLab native auto-merge.
  - component: gitlab.com/nomograph/pipeline/osv-verdict@v5.3.1
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/cargo-verdict@740db2f
    inputs:
      stage: verdict
      cargo_test_args: "--workspace"
  - component: gitlab.com/nomograph/pipeline/automerge-gate@v5.3.1
    inputs:
      stage: gate
      required-checks: "osv,cargo"

stages: [lint, test, build, sign, publish, release, notify, verdict, gate]

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

# PROBE-ONLY override, not part of the real repoint under test: pipeline
# 740db2f hardcodes rust-cli:v5.5.0, but that tag was never published
# (retag:rust-cli only fires on a real `git tag v5.5.0` push, which
# hasn't happened yet) -- registry 404s "manifest unknown" on both
# branches identically before either job's script runs. containers/
# rust-cli.Containerfile is byte-identical between v5.4.2 and 740db2f
# (confirmed via the pipeline repo's compare API, and rust-cli:latest's
# digest == rust-cli:v5.4.2's digest), so :latest is a functionally
# equivalent stand-in for the missing tag. This does not touch the
# --all-features wiring under test, which lives entirely in tool-rust.yml
# and cargo-verdict.yml's `script:`, not the image.
check:
  image: registry.gitlab.com/nomograph/pipeline/rust-cli:latest

cargo-verdict:
  image: registry.gitlab.com/nomograph/pipeline/rust-cli:latest
