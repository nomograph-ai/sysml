# cargo-deny v0.19+ configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# Deny any crate with a known vulnerability
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # paste (unmaintained) -- transitive via fastembed > tokenizers, no fix available upstream
    "RUSTSEC-2024-0436",
    # rand 0.9.2 unsound with custom logger using rand::rng() -- transitive via
    # fastembed > tokenizers and quinn-proto. Pinned-version dependency with no
    # upstream fix yet; we don't use rand::rng() with a custom logger anyway.
    "RUSTSEC-2026-0097",
    # bincode 1.3.x -- transitive via hnsw_rs > nomograph-sysml-core. hnsw_rs
    # pins bincode 1.3 and hasn't moved to 2.x; not liftable from our side.
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
